<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matemáticas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Matemáticas tradicionales</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d0d5dd;--accent:#2563eb;--accentSoft:#eff6ff;--ok:#16803c;--bad:#b42318;--warn:#92400e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,select,input{font:inherit} button{cursor:pointer}
.app{width:min(720px,100%);min-height:100vh;margin:0 auto;padding:10px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 34px rgba(16,24,40,.08)}
.setup-card{margin-top:1.5vh}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand-mark{width:58px;height:58px;border-radius:17px;background:var(--accent);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;color:#fff;overflow:hidden;box-shadow:0 8px 20px rgba(37,99,235,.22)}
.brand-mark span{display:grid;place-items:center;font-size:24px;font-weight:900;line-height:1}.brand-mark span:nth-child(2),.brand-mark span:nth-child(3){background:rgba(255,255,255,.09)}
h1{margin:0;font-size:clamp(27px,7vw,38px);line-height:1.05}.subtitle{margin:4px 0 0;color:var(--muted);font-size:14px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:850;margin:16px 0 8px}
.user-chips{display:flex;gap:8px;flex-wrap:wrap}.user-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;color:var(--text)}.user-chip.active{border-color:var(--accent);background:var(--accentSoft);color:#1d4ed8}.add-user{border-style:dashed;color:var(--accent)}
.new-user-row{display:none;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.new-user-row.show{display:grid}.new-user-row input{min-width:0}.compact-btn{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:850;padding:0 14px}
.operation-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.op-card{border:1px solid var(--line);background:#fff;border-radius:15px;min-height:78px;padding:7px 4px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--text)}.op-card .symbol{font-size:30px;font-weight:900;line-height:1}.op-card .name{font-size:11px;font-weight:800;color:var(--muted)}.op-card.active{border:2px solid var(--accent);background:var(--accentSoft);color:#1d4ed8}.op-card.active .name{color:#1d4ed8}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setting{display:grid;gap:5px}.setting.full{grid-column:1/-1}.setting span{font-size:13px;font-weight:800;color:#344054}.setting select{min-height:46px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:0 10px}
.user-summary{min-height:18px;margin-top:10px;color:var(--muted);font-size:13px}
.setup-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:14px}.setup-actions button{min-height:52px;border-radius:14px;font-size:16px;font-weight:850}.start{border:0;background:var(--accent);color:#fff}.history-btn{border:1px solid var(--line);background:#fff;color:var(--text)}
.install-app-btn{width:100%;min-height:46px;margin-top:9px;border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff;color:#1d4ed8;font-weight:850}
.topbar{height:50px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;margin-bottom:6px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--text);font-size:21px;font-weight:850;display:grid;place-items:center;padding:0}.counter{text-align:center;font-weight:850;font-size:15px}.exercise-card{padding:14px 10px 13px;display:flex;flex-direction:column;align-items:center}.exercise-label{font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}.math-wrap{width:100%;display:flex;align-items:center;justify-content:center;padding:6px 0 3px;min-height:190px}.math{--cell:54px;display:grid;grid-template-columns:34px repeat(var(--digits),var(--cell));grid-auto-rows:auto;justify-content:center;align-items:end;font-variant-numeric:tabular-nums;user-select:none}.small-input{width:34px;height:29px;padding:0;text-align:center;border:1.5px dashed #98a2b3;border-radius:8px;background:#fafafa;font-weight:850;font-size:17px;color:#7c3aed}.small-input.two{width:42px}.small-input:disabled{opacity:.15}.digit{height:55px;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;font-size:42px;font-weight:700;position:relative}.digit.changed{color:#98a2b3}.digit.changed::after{content:"";position:absolute;left:13%;right:13%;top:50%;height:3px;background:#667085;transform:rotate(-10deg);border-radius:4px}.op{align-self:center;justify-self:center;font-size:32px;font-weight:850}.rule{grid-column:1/-1;height:3px;background:var(--text);border-radius:3px;margin:2px 0 8px}.answer{width:46px;height:51px;padding:0;text-align:center;border:2px solid #98a2b3;border-radius:10px;font-family:"Courier New",monospace;font-size:33px;font-weight:750}.good{border-color:var(--ok)!important;background:#ecfdf3!important}.bad{border-color:var(--bad)!important;background:#fff1f0!important}.status{min-height:27px;margin:2px 0 6px;text-align:center;font-size:16px;font-weight:850}.status.ok{color:var(--ok)}.status.error{color:var(--bad)}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{min-height:52px;border-radius:14px;font-size:16px;font-weight:850}.main-btn{border:0;background:var(--accent);color:#fff}.answer-btn{border:1px solid var(--line);background:#fff;color:var(--text)}.answer-btn.confirm{border-color:#f59e0b;background:#fffbeb;color:var(--warn)}.answer-btn:disabled{opacity:.45;cursor:default}
.division-board{display:grid;grid-template-columns:auto auto;align-items:start;gap:0;font-family:"Courier New",monospace;font-weight:800}.dividend{font-size:42px;padding:4px 16px 4px 4px;border-right:3px solid var(--text);min-height:58px;display:flex;align-items:center}.div-right{display:grid;grid-template-rows:auto auto}.divisor{font-size:42px;padding:4px 10px 5px;border-bottom:3px solid var(--text);text-align:center}.quotient-inputs{display:flex;justify-content:center;gap:3px;padding-top:8px}.quotient-inputs .answer{width:42px;height:48px;font-size:30px}.division-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.44);display:none;align-items:center;justify-content:center;padding:14px;z-index:30}.modal.show{display:flex}.modal-card{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(16,24,40,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.modal-head h2{margin:0;font-size:22px}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}.info-text{color:#475467;line-height:1.5;font-size:14px}.info-text p{margin:9px 0}.history-user{color:var(--muted);margin:-3px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#f8fafc;border:1px solid #eaecf0;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.history-list{display:grid;gap:9px}.history-item{border:1px solid #eaecf0;border-radius:13px;padding:10px 11px}.history-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.expression{font-family:"Courier New",monospace;font-size:18px;font-weight:800}.date{font-size:12px;color:var(--muted);white-space:nowrap}.attempts{margin-top:6px;color:#475467;font-size:13px;line-height:1.45}.tag{display:inline-block;padding:2px 7px;margin:2px 3px 0 0;border-radius:999px;background:#f2f4f7;font-size:12px}.tag.oktag{background:#ecfdf3;color:#166534}.tag.badtag{background:#fff1f0;color:#991b1b}.empty{color:var(--muted);text-align:center;padding:22px 8px}.history-footer{margin-top:14px;display:flex;justify-content:flex-end}.danger{border:1px solid #fda29b;color:#b42318;background:#fff;border-radius:11px;min-height:42px;padding:0 12px;font-weight:800}
.update-banner{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:#172033;color:#fff;border-radius:15px;padding:10px 11px 10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:50;box-shadow:0 10px 30px rgba(16,24,40,.3)}.update-banner.show{display:flex}.update-banner span{font-size:14px;font-weight:750}.update-banner button{border:0;background:#fff;color:#172033;border-radius:10px;padding:9px 12px;font-weight:900}
@media(max-width:560px){.operation-grid{gap:6px}.op-card{min-height:70px}.op-card .symbol{font-size:27px}.settings{gap:8px}.math{--cell:48px;grid-template-columns:28px repeat(var(--digits),var(--cell))}.digit{font-size:38px;height:51px}.answer{width:41px;height:47px;font-size:29px}.small-input{width:31px;height:27px;font-size:16px}.small-input.two{width:39px}.math-wrap{min-height:176px}.dividend,.divisor{font-size:36px}.division-board{max-width:100%}}

/* V9 - navegación por pasos */
.page-head{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  margin-bottom:10px;
}
.page-head-title{
  text-align:center;
  font-size:17px;
  font-weight:900;
}
.page-head-sub{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-top:1px;
}
.ghost-space{width:40px;height:40px}
.user-list{
  display:grid;
  gap:10px;
  margin-top:10px;
}
.user-card{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:14px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
}
.user-card:active{transform:scale(.995)}
.user-name{
  font-size:18px;
  font-weight:900;
}
.user-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.user-arrow{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--accentSoft);
  color:var(--accent);
  font-size:21px;
  font-weight:900;
  flex:0 0 auto;
}
.new-user-button{
  width:100%;
  min-height:50px;
  margin-top:10px;
  border:1px dashed #93c5fd;
  border-radius:15px;
  background:#f8fbff;
  color:#1d4ed8;
  font-weight:900;
}
.operation-choice-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:12px;
}
.operation-choice{
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  min-height:132px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
}
.operation-choice .big-symbol{
  width:58px;height:58px;
  border-radius:17px;
  display:grid;place-items:center;
  background:var(--accentSoft);
  color:var(--accent);
  font-size:37px;
  font-weight:900;
}
.operation-choice .op-title{
  font-size:17px;
  font-weight:900;
}
.operation-choice .op-hint{
  font-size:11px;
  color:var(--muted);
}
.history-inline{
  width:40px;height:40px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  display:grid;place-items:center;
  font-size:18px;
}
.level-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.level-btn{
  min-height:64px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  font-weight:850;
  padding:8px 7px;
}
.level-btn small{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-top:2px;
}
.level-btn.active{
  border:2px solid var(--accent);
  background:var(--accentSoft);
  color:#1d4ed8;
}
.segment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.segment button{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  font-weight:850;
}
.segment button.active{
  border:2px solid var(--accent);
  background:var(--accentSoft);
  color:#1d4ed8;
}
.difficulty-start{
  width:100%;
  min-height:54px;
  margin-top:16px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-size:17px;
  font-weight:900;
}
.selected-user-box{
  border:1px solid #dbeafe;
  background:#f8fbff;
  border-radius:14px;
  padding:10px 12px;
  color:#344054;
  font-size:13px;
  margin-top:12px;
}
.selected-user-box b{color:var(--text)}
@media(max-width:420px){
  .operation-choice{min-height:116px}
  .operation-choice .big-symbol{width:52px;height:52px;font-size:33px}
  .level-grid{gap:7px}
}


/* V11 - suma con varios sumandos y multiplicación visual escalonada */
.mul-process{
  width:min(420px,100%);
  display:grid;
  gap:8px;
  justify-items:center;
}
.mul-paper{
  --mul-cell:46px;
  display:grid;
  grid-template-columns:28px repeat(var(--mul-columns),var(--mul-cell));
  grid-auto-rows:auto;
  justify-content:center;
  align-items:center;
  font-family:"Courier New",monospace;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.mul-number{
  grid-column:2/-1;
  text-align:right;
  font-size:39px;
  line-height:1.12;
  padding-right:5px;
}
.mul-multiplier{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
  font-size:39px;
  line-height:1.12;
  padding-right:5px;
}
.mul-multiplier .mul-sign{font-size:30px}
.mul-rule{
  grid-column:1/-1;
  height:3px;
  background:var(--text);
  border-radius:3px;
  margin:3px 0 8px;
}
.mul-step-input{
  width:70px;
  height:45px;
  justify-self:end;
  border:2px solid #98a2b3;
  border-radius:10px;
  text-align:center;
  font-family:"Courier New",monospace;
  font-size:25px;
  font-weight:800;
}
.mul-step-row{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-end;
  padding-right:calc(var(--step) * var(--mul-cell));
}
.mul-final{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-end;
  gap:3px;
}
.mul-final .answer{
  width:42px;
  height:48px;
  font-size:29px;
}
.mul-order-note{
  color:var(--muted);
  font-size:11px;
  text-align:center;
}
.addend-note{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}
@media(max-width:420px){
  .mul-paper{--mul-cell:42px}
  .mul-number,.mul-multiplier{font-size:36px}
  .mul-step-input{width:64px;height:42px;font-size:23px}
}

</style>
</head>
<body>
<div class="app">

<!-- 1. USUARIOS -->
<section id="userScreen" class="screen active">
  <div class="card setup-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span>+</span><span>−</span><span>×</span><span>÷</span></div>
      <div><h1>Matemáticas tradicionales</h1><p class="subtitle">¿Quién va a practicar?</p></div>
    </div>

    <div id="userList" class="user-list"></div>
    <button id="newUserBtn" class="new-user-button">+ Crear nuevo usuario</button>

    <div id="newUserRow" class="new-user-row">
      <input id="newUserName" type="text" maxlength="24" placeholder="Nombre">
      <button id="saveUserBtn" class="compact-btn">Crear</button>
    </div>
  </div>
</section>

<!-- 2. OPERACIÓN -->
<section id="operationScreen" class="screen">
  <div class="page-head">
    <button id="backUsersBtn" class="icon-btn" aria-label="Usuarios">←</button>
    <div class="page-head-title"><span id="operationUserName">Usuario</span><span class="page-head-sub">Elige qué quieres practicar</span></div>
    <button id="historyBtn" class="history-inline" aria-label="Historial">▤</button>
  </div>

  <div class="card">
    <div class="operation-choice-grid">
      <button class="operation-choice" data-op="add">
        <span class="big-symbol">+</span><span class="op-title">Sumas</span><span class="op-hint">Con y sin llevadas</span>
      </button>
      <button class="operation-choice" data-op="sub">
        <span class="big-symbol">−</span><span class="op-title">Restas</span><span class="op-hint">Método tradicional</span>
      </button>
      <button class="operation-choice" data-op="mul">
        <span class="big-symbol">×</span><span class="op-title">Multiplicar</span><span class="op-hint">Niveles iniciales</span>
      </button>
      <button class="operation-choice" data-op="div">
        <span class="big-symbol">÷</span><span class="op-title">Dividir</span><span class="op-hint">Divisiones exactas</span>
      </button>
    </div>
    <div id="operationUserStats" class="selected-user-box"></div>
  </div>
</section>

<!-- 3. DIFICULTAD -->
<section id="difficultyScreen" class="screen">
  <div class="page-head">
    <button id="backOperationsBtn" class="icon-btn" aria-label="Operaciones">←</button>
    <div class="page-head-title"><span id="difficultyTitle">Sumas</span><span class="page-head-sub">Elige el nivel</span></div>
    <div class="ghost-space"></div>
  </div>

  <div class="card">
    <div id="difficultyOptions"></div>
    <button id="startBtn" class="difficulty-start">Empezar</button>
  </div>
</section>

<!-- 4. EJERCICIOS -->
<section id="exerciseScreen" class="screen">
  <div class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Volver">←</button>
    <div id="counter" class="counter">Hechas: 0</div>
    <button id="infoBtn" class="icon-btn" aria-label="Información">i</button>
  </div>

  <div class="card exercise-card">
    <div id="exerciseLabel" class="exercise-label"></div>
    <div class="math-wrap"><div id="math"></div></div>
    <div id="status" class="status"></div>
    <div class="actions">
      <button id="mainBtn" class="main-btn">Corregir</button>
      <button id="solutionBtn" class="answer-btn">Ver respuesta</button>
    </div>
  </div>
</section>

</div>

<div id="infoModal" class="modal" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><h2>Cómo se hace</h2><button id="closeInfo" class="close">×</button></div><div id="infoText" class="info-text"></div></div></div>
<div id="historyModal" class="modal" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><h2>Historial</h2><button id="closeHistory" class="close">×</button></div><div id="historyUser" class="history-user"></div><div id="stats" class="stats"></div><div id="historyList" class="history-list"></div><div class="history-footer"><button id="clearHistory" class="danger">Borrar historial</button></div></div></div>
<button id="installBtn" style="display:none"></button>
<div id="updateBanner" class="update-banner"><span>Nueva versión disponible</span><button id="updateBtn">Actualizar</button></div>

<script>


const $=id=>document.getElementById(id);
const STORAGE_KEY='sumasRestas_v5'; // conservar datos de versiones anteriores
const RETENTION_DAYS=30;

let db=loadDB();
let currentUser='';
let selectedOp='add';
let settingsState={
  add:{preset:'3x3',digits:3,count:3,carry:'yes'},
  sub:{digits:3,carry:'yes'},
  mul:{preset:'1x1',top:1,carry:'mix'},
  div:{preset:'basic',dividend:2}
};
let current=null,record=null,completedThisSession=0,exerciseSolved=false,revealConfirm=false;

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    const data=raw?JSON.parse(raw):{users:{},lastUser:''};
    if(!data.users)data.users={};
    pruneOld(data);
    return data;
  }catch(e){return{users:{},lastUser:''}}
}
function saveDB(){pruneOld(db);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){}}
function pruneOld(data){
  const limit=Date.now()-RETENTION_DAYS*86400000;
  Object.values(data.users||{}).forEach(u=>u.history=(u.history||[]).filter(x=>new Date(x.date).getTime()>=limit))
}
function ensureUser(name){
  const clean=(name||'').trim().slice(0,24);
  if(!clean)return'';

function addCarries(numbers,n){
  let carry=0,carries=Array(n).fill(0),any=false;
  const all=numbers.map(x=>digitsOf(x,n));
  for(let i=n-1;i>=0;i--){
    const total=all.reduce((s,d)=>s+d[i],carry);
    const out=Math.floor(total/10);
    if(out>0)any=true;
    if(i>0)carries[i-1]=out;
    carry=out;
  }
  return{carries,any}
}

function randomComposition(total,count,minEach=0){
  const vals=Array(count).fill(minEach);
  let remaining=total-minEach*count;
  while(remaining>0){
    const i=rint(0,count-1);
    if(vals[i]<9){vals[i]++;remaining--}
  }
  return vals;
}

function generateNoCarryAddends(digits,count){
  const columns=[];
  for(let col=0;col<digits;col++){
    const minEach=col===0?1:0;
    const minTotal=minEach*count;
    const target=rint(minTotal,9);
    const vals=randomComposition(target,count,minEach);
    // mezclar para no favorecer siempre al primer sumando
    for(let i=vals.length-1;i>0;i--){
      const j=rint(0,i);[vals[i],vals[j]]=[vals[j],vals[i]];
    }
    columns.push(vals);
  }
  const nums=Array(count).fill(0);
  for(let r=0;r<count;r++){
    let s='';
    for(let c=0;c<digits;c++)s+=columns[c][r];
    nums[r]=+s;
  }
  return nums;
}

function generateAddends(digits,count,carryMode){
  if(carryMode==='no')return generateNoCarryAddends(digits,count);
  const [min,max]=exactDigits(digits);
  let nums,meta,tries=0;
  do{
    nums=Array.from({length:count},()=>rint(min,max));
    meta=addCarries(nums,digits);
    tries++;
  }while(!meta.any&&tries<30000);
  return nums;
}
function subState(a,b,n){
  const A=digitsOf(a,n),B=digitsOf(b,n);
  let carryToBottom=0;
  const borrowTop=Array(n).fill(0),bottomReplacement=Array(n).fill(null);
  for(let i=n-1;i>=0;i--){
    const effectiveBottom=B[i]+carryToBottom;
    if(carryToBottom===1)bottomReplacement[i]=effectiveBottom;
    const borrow=A[i]<effectiveBottom?1:0;
    borrowTop[i]=borrow;
    carryToBottom=borrow;
  }
  return{borrowTop,bottomReplacement,any:borrowTop.some(Boolean)}
}
function mulCarries(a,m,n){
  const A=digitsOf(a,n);
  let carry=0,carries=Array(n).fill(0),any=false;
  for(let i=n-1;i>=0;i--){
    const total=A[i]*m+carry;
    const out=Math.floor(total/10);
    if(out>0)any=true;
    if(i>0)carries[i-1]=out;
    carry=out;
  }
  return{carries,any}
}
function matchCarry(any,mode){return mode==='mix'||(mode==='yes'?any:!any)}

function newExercise(){
  const op=selectedOp;
  let a,b,result,n,meta={},tries=0,operands=null;

  if(op==='add'){
    const s=settingsState.add;
    const preset=SUM_PRESETS.find(x=>x[0]===s.preset)||SUM_PRESETS[2];
    s.digits=preset[1];s.count=preset[2];
    n=s.digits;
    operands=generateAddends(s.digits,s.count,s.carry);
    meta=addCarries(operands,n);
    result=operands.reduce((sum,x)=>sum+x,0);
    a=operands[0];b=operands[1]??0;
    meta.carryMode=s.carry;
    meta.addendCount=s.count;
  }else if(op==='sub'){
    const s=settingsState.sub,[min,max]=exactDigits(s.digits);
    n=s.digits;
    do{
      a=rint(min,max);b=rint(min,max);if(b>a)[a,b]=[b,a];meta=subState(a,b,n);tries++;
    }while(!matchCarry(meta.any,s.carry)&&tries<30000);
    result=a-b;meta.carryMode=s.carry;
  }else if(op==='mul'){
    const s=settingsState.mul,[min,max]=exactDigits(s.top);
    n=s.top;
    a=rint(min,max);b=rint(2,9);
    result=a*b;
    const A=digitsOf(a,n);
    meta.stepDigits=[...A].reverse();
    meta.stepProducts=meta.stepDigits.map(d=>d*b);
  }else{
    const s=settingsState.div;
    if(s.preset==='basic'){
      do{
        b=rint(2,5);
        const q=rint(1,5);
        a=b*q;
        result=q;
      }while(a>20);
    }else if(s.preset==='tables'){
      b=rint(2,9);
      result=rint(1,9);
      a=b*result;
    }else{
      b=rint(2,9);
      const qmin=Math.ceil(10/b),qmax=Math.floor(99/b);
      result=rint(Math.max(2,qmin),Math.max(2,qmax));
      a=b*result;
      if(a<10||a>99){a=24;b=3;result=8}
    }
    n=String(result).length;
    meta.remainder=0;meta.level=s.preset;
  }

  current={op,a,b,result,n,operands,...meta};
  record={
    date:new Date().toISOString(),
    operation:op,a,b,result,
    operands:operands?operands.slice():undefined,
    settings:JSON.parse(JSON.stringify(settingsState[op])),
    attempts:[],solutionUsed:false
  };
  renderExercise();
}

      const repl=current.bottomReplacement[+inp.dataset.index];
      const exp=repl===null?'':String(repl);
      const good=inp.value===exp||(exp===''&&inp.value==='0');
      inp.classList.add(good?'good':'bad');
      if(!good)ok=false;
      const original=$('bottom-'+inp.dataset.index);
      if(original)original.classList.toggle('changed',inp.value!=='');
    });
  }

  record.attempts.push({at:new Date().toISOString(),answer:enteredAnswer(),correct:ok,work:snapshotWork()});

  if(ok){
    exerciseSolved=true;
    $('status').textContent='¡Muy bien! ✓';
    $('status').className='status ok';
    $('mainBtn').textContent='Siguiente';
    $('solutionBtn').disabled=true;
    commitRecord();
    completedThisSession++;
    updateCounter();
  }else{
    $('status').textContent='Revisa las casillas en rojo';
    $('status').className='status error';
  }
  return ok;
}
function fillSolution(){
  const ans=expectedMap();

  document.querySelectorAll('#math [data-type="answer"]').forEach(inp=>{
    inp.value=ans[+inp.dataset.index]??'';
    inp.classList.remove('bad');
    inp.classList.add('good');
  });

  if(current.op==='add'){
    document.querySelectorAll('[data-type="addcarry"]').forEach(inp=>{
      if(!inp.disabled){
        inp.value=current.carries[+inp.dataset.index]?String(current.carries[+inp.dataset.index]):'';
        inp.classList.add('good');
      }
    });
  }else if(current.op==='mul'){
    document.querySelectorAll('[data-type="mulstep"]').forEach(inp=>{
      inp.value=String(current.stepProducts[+inp.dataset.index]);
      inp.classList.remove('bad');
      inp.classList.add('good');
    });
  }else if(current.op==='sub'){
    document.querySelectorAll('[data-type="borrow"]').forEach(inp=>{
      inp.value=current.borrowTop[+inp.dataset.index]?'1':'';
      inp.classList.add('good');
    });
    document.querySelectorAll('[data-type="bottomreplacement"]').forEach(inp=>{
      const repl=current.bottomReplacement[+inp.dataset.index];
      inp.value=repl===null?'':String(repl);
      inp.classList.add('good');
      const original=$('bottom-'+inp.dataset.index);
      if(original)original.classList.toggle('changed',repl!==null);
    });
  }

  record.solutionUsed=true;
  exerciseSolved=true;
  $('status').textContent='Respuesta mostrada';
  $('status').className='status ok';
  $('mainBtn').textContent='Siguiente';
  $('solutionBtn').disabled=true;
  resetReveal();
  commitRecord();
  completedThisSession++;
  updateCounter();
}
function commitRecord(){if(!record||!currentUser)return;record.completedAt=new Date().toISOString();db.users[currentUser].history.push(record);saveDB();record=null}
function resetReveal(){revealConfirm=false;$('solutionBtn').textContent='Ver respuesta';$('solutionBtn').classList.remove('confirm')}
function updateCounter(){$('counter').textContent=`Hechas: ${completedThisSession} · Total: ${totalDone(currentUser)}`}

function infoHtml(){
  if(selectedOp==='add')return '<p><b>Sumas:</b> escribe las llevadas en las casillas pequeñas de arriba y el resultado debajo de la línea.</p><p>Los números pueden tener distinta cantidad de cifras y se alinean por la derecha.</p>';
  if(selectedOp==='sub')return '<p><b>Restas:</b> si no puedes restar, escribe un <b>1 arriba</b> para añadir 10.</p><p>Ese 1 pasa a la columna de la izquierda: <b>súmalo al número de abajo y escribe su nuevo valor</b>. El número anterior se tacha automáticamente.</p>';
  if(selectedOp==='mul')return '<p><b>Multiplicaciones:</b> empieza por la cifra de la derecha y calcula cada cifra por separado. Por ejemplo, en 666 × 2, escribe 12, 12 y 12.</p><p>Las casillas se colocan escalonadas para mostrar su posición. Después escribe el resultado final debajo de la línea.</p>';
  return '<p><b>Divisiones:</b> de momento son divisiones exactas y sencillas, con divisor de una cifra.</p><p>Más adelante añadiremos el desarrollo completo de la división tradicional.</p>';
}
function renderHistory(name){const hist=[...historyFor(name)].sort((a,b)=>new Date(b.date)-new Date(a.date));$('historyUser').textContent=name?`${name} · últimos ${RETENTION_DAYS} días`:'Selecciona un usuario';if(!name||!db.users[name]){$('stats').innerHTML='';$('historyList').innerHTML='<div class="empty">No hay un usuario seleccionado.</div>';$('clearHistory').style.display='none';return}$('clearHistory').style.display='inline-block';const total=hist.length,firstTry=hist.filter(x=>x.attempts?.length===1&&x.attempts[0].correct&&!x.solutionUsed).length,solutions=hist.filter(x=>x.solutionUsed).length;$('stats').innerHTML=`<div class="stat"><b>${total}</b><span>ejercicios</span></div><div class="stat"><b>${firstTry}</b><span>a la primera</span></div><div class="stat"><b>${solutions}</b><span>con respuesta</span></div>`;if(!hist.length){$('historyList').innerHTML='<div class="empty">Todavía no hay ejercicios guardados.</div>';return}$('historyList').innerHTML=hist.map(x=>{const dt=new Date(x.date),date=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),op=symbolOp(x.operation),tries=(x.attempts||[]).map((a,i)=>`<span class="tag ${a.correct?'oktag':'badtag'}">${i+1}: ${escapeHtml(a.answer)} ${a.correct?'✓':'✗'}</span>`).join(' '),sol=x.solutionUsed?'<span class="tag">vio respuesta</span>':'';return `<div class="history-item"><div class="history-top"><div><div class="expression">${x.operation==='add'&&x.operands?.length?x.operands.join(' + '):`${x.a} ${op} ${x.b}`} = ${x.result}</div><span class="tag">${labelOp(x.operation)}</span></div><div class="date">${date}</div></div><div class="attempts">${tries||'<span class="tag">sin correcciones</span>'} ${sol}</div></div>`}).join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('backUsersBtn').onclick=()=>{showScreen('userScreen');renderUsers()};
$('backOperationsBtn').onclick=()=>{showScreen('operationScreen');updateOperationStats()};
$('startBtn').onclick=()=>{
  if(!currentUser||!db.users[currentUser])return showScreen('userScreen');
  completedThisSession=0;
  updateCounter();
  showScreen('exerciseScreen');
  newExercise();
};
$('backBtn').onclick=()=>{showScreen('difficultyScreen');renderDifficulty()};
$('mainBtn').onclick=()=>exerciseSolved?newExercise():grade();
$('solutionBtn').onclick=()=>{
  if(!revealConfirm){
    revealConfirm=true;
    $('solutionBtn').textContent='¿Seguro?';
    $('solutionBtn').classList.add('confirm');
    setTimeout(()=>{if(revealConfirm)resetReveal()},4000);
  }else fillSolution()
};
$('infoBtn').onclick=()=>{$('infoText').innerHTML=infoHtml();$('infoModal').classList.add('show')};
$('closeInfo').onclick=()=>$('infoModal').classList.remove('show');
$('infoModal').onclick=e=>{if(e.target===$('infoModal'))$('infoModal').classList.remove('show')};
$('historyBtn').onclick=()=>{renderHistory(currentUser);$('historyModal').classList.add('show')};
$('closeHistory').onclick=()=>$('historyModal').classList.remove('show');
$('historyModal').onclick=e=>{if(e.target===$('historyModal'))$('historyModal').classList.remove('show')};
$('clearHistory').onclick=()=>{
  if(!currentUser||!db.users[currentUser])return;
  if(confirm(`¿Borrar todo el historial de ${currentUser}?`)){
    db.users[currentUser].history=[];
    saveDB();
    renderHistory(currentUser);
    updateOperationStats();
    renderUsers();
  }
};

/* Instalación y actualizaciones PWA */
let deferredInstallPrompt=null,swRegistration=null,refreshing=false;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event});
function showUpdate(){if(navigator.serviceWorker.controller)$('updateBanner').classList.add('show')}
$('updateBtn').onclick=()=>{if(swRegistration?.waiting)swRegistration.waiting.postMessage({type:'SKIP_WAITING'})};
if('serviceWorker'in navigator){
  window.addEventListener('load',async()=>{
    try{
      swRegistration=await navigator.serviceWorker.register('./service-worker.js');
      if(swRegistration.waiting)showUpdate();
      swRegistration.addEventListener('updatefound',()=>{
        const nw=swRegistration.installing;
        nw?.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})
      });
      swRegistration.update().catch(()=>{})
    }catch(e){}
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')swRegistration?.update().catch(()=>{})})
}

renderUsers();


</script>
</body>
</html>
